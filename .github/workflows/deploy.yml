name: Deploy Strapi

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ghcr.io/vlad-vishnevskii/strapi-tili-mili:latest
  SERVER_APP_DIR: /var/www/strapi-tili-mili

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u vlad-vishnevskii --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_NAME }}

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml"
          target: ${{ env.SERVER_APP_DIR }}
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            mkdir -p ${{ env.SERVER_APP_DIR }}/data/sqlite
            mkdir -p ${{ env.SERVER_APP_DIR }}/data/uploads

            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u vlad-vishnevskii --password-stdin

            cd ${{ env.SERVER_APP_DIR }}

            if command -v docker-compose >/dev/null 2>&1
            then
              docker-compose -f docker-compose.prod.yml pull
              docker-compose -f docker-compose.prod.yml up -d
            else
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d
            fi
